name: mood_journal
description: "Дневник настроения в стиле Reflectly"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0' # Обновил SDK для совместимости с новыми пакетами

dependencies:
  flutter:
    sdk: flutter

  # --- State Management & DI (Архитектура) ---
  flutter_bloc: ^8.1.6       # Заменили Riverpod на BLoC по твоему списку
  get_it: ^7.7.0             # Внедрение зависимостей (DI) для Clean Architecture
  equatable: ^2.0.5          # Для удобного сравнения состояний BLoC

  # --- Локальная база данных ---
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # --- Навигация и UI ---
  go_router: ^14.0.0
  google_fonts: ^6.2.1
  flutter_slidable: ^3.1.0
  cupertino_icons: ^1.0.8

  # --- Работа с сетью (REST API) ---
  dio: ^5.4.3                # Мощный клиент для сетевых запросов и цитат дня

  # --- Утилиты ---
  intl: ^0.19.0              # Для красивого форматирования дат
  uuid: ^4.3.3               # Для генерации уникальных ID заметок

  # --- Бэкенд Firebase (Раскомментируй, когда начнешь этап с Firebase) ---
  # firebase_core: ^3.0.0
  # firebase_auth: ^5.0.0
  # cloud_firestore: ^5.0.0
  # firebase_crashlytics: ^4.0.0
  # firebase_messaging: ^15.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

  # --- Генераторы кода (Нужны для Hive и Clean Architecture) ---
  build_runner: ^2.4.9
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  # assets:
  #   - assets/images/
  #   - assets/icons/
